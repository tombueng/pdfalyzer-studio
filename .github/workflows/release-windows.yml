name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The fat JAR is built on Linux: on Windows the Maven build fails because the jar embeds both a
  # META-INF/LICENSE file and a META-INF/license/ directory, which collide on a case-insensitive
  # filesystem. The Windows job only packages this prebuilt JAR.
  build-jar:
    name: Build app JAR (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: oracle
          cache: maven

      - name: Build fat JAR
        run: mvn clean package spring-boot:repackage -DskipTests --batch-mode --no-transfer-progress

      - name: Stage JAR
        run: |
          mkdir -p staged-jar
          cp target/pdfalyzer-studio-*.jar staged-jar/pdfalyzer-studio.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: staged-jar/pdfalyzer-studio.jar
          retention-days: 1

  build-windows-installer:
    name: Build MSI + Portable EXE
    needs: build-jar
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: oracle
          cache: maven

      - name: Cache installer bundle (JRE + Chromium + Launch4j + WiX)
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: installer/windows/bundle
          key: installer-bundle-${{ hashFiles('installer/windows/update-components.ps1') }}

      - name: Download prebuilt app JAR
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: installer/windows/bundle/app

      - name: Download installer components (JRE + Chromium + Launch4j + WiX)
        shell: pwsh
        working-directory: installer/windows
        run: |
          if ('${{ steps.cache-bundle.outputs.cache-hit }}' -eq 'true') {
            ./update-components.ps1 -SkipDownloads -SkipApp
          } else {
            ./update-components.ps1 -SkipApp
          }

      - name: Build MSI installer
        shell: cmd
        working-directory: installer/windows
        run: build-installer.bat

      - name: Download Warp packer
        shell: pwsh
        continue-on-error: true
        run: |
          $url = 'https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe'
          Invoke-WebRequest -Uri $url -OutFile warp-packer.exe

      - name: Build portable single-file EXE with Warp
        shell: pwsh
        continue-on-error: true
        run: |
          $stage = 'installer/windows/portable-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse installer/windows/bundle/app       "$stage/app"
          Copy-Item -Recurse installer/windows/bundle/jre       "$stage/jre"
          Copy-Item -Recurse installer/windows/bundle/chromium  "$stage/chromium"
          Copy-Item        installer/windows/output/PdfalyzerStudio.exe "$stage/PdfalyzerStudio.exe"
          ./warp-packer.exe --arch windows-x64 --input_dir $stage --exec PdfalyzerStudio.exe --output installer/windows/output/PdfalyzerStudio-portable.exe

      - name: Upload artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: pdfalyzer-windows-installer
          path: |
            installer/windows/output/PdfalyzerStudioInstaller.msi
            installer/windows/output/PdfalyzerStudio-portable.exe
          retention-days: 30

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/windows/output/PdfalyzerStudioInstaller.msi
            installer/windows/output/PdfalyzerStudio-portable.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
